name: Daily Project Automation Engine

on:
  schedule:
    # Runs daily at 00:00 UTC (adjust if you prefer a different time)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate without calling Gemini API (Dry Run)'
        required: false
        type: boolean
        default: false
      force_stack:
        description: 'Force a specific Tech Stack'
        required: false
        type: choice
        default: 'Auto'
        options:
          - 'Auto'
          - 'mern'
          - 'php'
          - 'python'
          - 'golang'
          - 'typescript_fullstack'
      force_day:
        description: 'Override target day number (1-365)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  generate-daily-project:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'generator/requirements.txt'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r generator/requirements.txt

      - name: ⚡ Generate Project with Google Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FALLBACK_ON_ERROR: "true"
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.force_stack }}" ] && [ "${{ inputs.force_stack }}" != "Auto" ]; then
            ARGS="$ARGS --stack ${{ inputs.force_stack }}"
          fi
          if [ -n "${{ inputs.force_day }}" ]; then
            ARGS="$ARGS --day ${{ inputs.force_day }}"
          fi

          echo "Executing generator with arguments: $ARGS"
          python generator/generate.py $ARGS

      - name: 🚀 Commit & Push Generated Project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --staged --quiet; then
            echo "No changes detected. Nothing to commit."
          else
            # Extract latest project metadata for clean commit message
            DAY=$(python -c "import json; h=json.load(open('projects_history.json')); print(f'{h[-1][\"day\"]:03d}')")
            TITLE=$(python -c "import json; h=json.load(open('projects_history.json')); print(h[-1]['title'])")
            STACK=$(python -c "import json; h=json.load(open('projects_history.json')); print(h[-1]['tech_stack'])")

            COMMIT_MSG="🚀 Day ${DAY}: ${TITLE} [${STACK}]"
            echo "Committing: $COMMIT_MSG"
            git commit -m "$COMMIT_MSG"
            git push origin HEAD:${{ github.ref_name }}
          fi
